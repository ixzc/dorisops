name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Golden eval E1–E6
        run: python -m pytest -q tests/test_golden.py
      - name: Full suite (no live cluster)
        run: python -m pytest -q -m "not live"
        env:
          DORISOPS_LIVE_CLUSTER: ""
