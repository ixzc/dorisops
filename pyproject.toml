[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dorisops"
version = "0.1.0.dev0"
description = "Read-only AI ops workbench for Apache Doris (integrated and cloud)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "Zhenchao Xu" }]
keywords = ["apache-doris", "sre", "observability", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
dorisops = "dorisops.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
inspect = ["pymysql>=1.1.0", "PyYAML>=6.0"]
mcp = ["mcp>=1.2.0"]

[project.urls]
Homepage = "https://github.com/ixzc/dorisops"
Issues = "https://github.com/ixzc/dorisops/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dorisops = ["playbooks/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
